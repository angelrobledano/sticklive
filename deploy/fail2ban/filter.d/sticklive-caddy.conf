[Definition]

# Caddy escribe access logs JSON. Ban cuando la respuesta es 429 (rate limit /
# anti-scraping) o 403 (p. ej. admin sin token). El orden real de los campos es
# request.remote_ip antes de status.
failregex = ^.*"remote_ip"\s*:\s*"<HOST>".*"status"\s*:\s*(?:429|403)\b.*$

# No banear crawlers declarados: si Google/Bing reciben 429 por cuota, un ban
# de fail2ban les impediría seguir rastreando. El User-Agent es falsificable;
# un scraper que lo imite seguirá sujeto a las cuotas de la API.
ignoreregex = (?i)^.*"User-Agent"\s*:\s*\["[^"]*(?:googlebot|bingbot|duckduckbot|yandexbot|applebot)[^"]*"\].*$
