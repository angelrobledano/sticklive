[Definition]

# Docker publica 80/443 con DNAT: los paquetes pasan por FORWARD/DOCKER-USER,
# no por INPUT. Por eso el ban se inserta en DOCKER-USER y no en INPUT (un
# `iptables -I INPUT` no bloquearía el tráfico que llega a Caddy).
#
# Se ejecutan iptables e ip6tables y se ignora el que no corresponda al tipo de
# IP; así el mismo jail cubre IPv4 e IPv6 sin dos acciones separadas.

actionstart =
actionstop =
actioncheck = /usr/sbin/iptables -w -n -L DOCKER-USER >/dev/null 2>&1

actionban = /usr/sbin/iptables -w -I DOCKER-USER -s <ip> -m comment --comment "fail2ban-sticklive" -j DROP 2>/dev/null || true; /usr/sbin/ip6tables -w -I DOCKER-USER -s <ip> -m comment --comment "fail2ban-sticklive" -j DROP 2>/dev/null || true

actionunban = /usr/sbin/iptables -w -D DOCKER-USER -s <ip> -m comment --comment "fail2ban-sticklive" -j DROP 2>/dev/null || true; /usr/sbin/ip6tables -w -D DOCKER-USER -s <ip> -m comment --comment "fail2ban-sticklive" -j DROP 2>/dev/null || true
