name: SEO check

# F6: control diario de sitemap, canonical y OG contra producción. No toca
# producto ni datos; solo lee y falla si una ficha del sitemap se degrada.
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Evita que Node elija IPv6 si el runner no la tiene: el sitio resuelve
      # por IPv4 desde el VPS.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Sitemap, canonical y OG
        run: npm run seo:check --workspace=apps/web -- --base=https://sticklive.eu
