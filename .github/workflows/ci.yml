name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Calidad del código ──────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # `tests/` no es un workspace npm, así que `turbo run typecheck` no lo ve.
      # Sin esto, los tests de integración serían el único código del repo sin
      # comprobar — que es exactamente el hueco que tenía `packages/db/scripts/`.
      - name: Typecheck de los tests de integración
        run: npx tsc --noEmit -p tests

      - name: Tests
        run: npm run test

      # Ya NO lleva continue-on-error: el repo está a cero avisos y la idea es
      # que siga así. Si esto se pone rojo, es que algo entró sin revisar.
      - name: Lint
        run: npm run lint

      # BLOQUEANTE desde el 21/07/2026 (issue #37). Antes no lo era, y por una
      # razón deliberada: había 8 vulnerabilidades en dependencias de producción
      # y el pipeline habría quedado rojo de forma permanente, que es la manera
      # más rápida de enseñar a ignorar el rojo. Primero se limpió (nodemailer 9
      # y Next 16), y sólo entonces se endureció.
      #
      # Además, desde que producción corre JS compilado sin devDependencies
      # (PR #49), `--omit=dev` audita de verdad lo que se ejecuta en el
      # servidor. Antes no: corría con `npx tsx`, que es devDependency.
      # La app móvil NO se despliega (excluida del build de producción por
      # .dockerignore) y sus deps de toolchain (expo) no deben tumbar este gate.
      # Auditamos solo los workspaces del servidor, derivados del Dockerfile de
      # producción (= lo que se copia a la imagen). El audit completo (con la app
      # móvil) sigue en el paso informativo de abajo, sin bloquear.
      - name: Audit (prod deps)
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          cp package.json package-lock.json "$d/"
          grep -oE '^COPY (apps|packages)/[^/]+/package\.json' deploy/Dockerfile \
            | awk '{print $2}' | xargs -n1 dirname | sort -u \
            | while read -r w; do
                mkdir -p "$d/$w"
                cp "$w/package.json" "$d/$w/"
              done
          cd "$d"
          npm audit --omit=dev --audit-level=high

      # Informativo, NO bloquea. El umbral de arriba es `high` por una razón
      # concreta: queda un `postcss` moderate dentro del propio Next
      # (node_modules/next/node_modules/postcss) que no tiene arreglo — npm
      # llega a proponer bajar a next@9.3.3. Es de build y el CSS que
      # procesamos es nuestro, así que no es un riesgo real.
      #
      # Pero bloquear en `high` y no mirar nunca lo de abajo es cómodo hoy y
      # ciego dentro de seis meses. Este paso deja el listado completo visible
      # en cada ejecución sin frenar a nadie.
      - name: Audit informativo (incluye moderate)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

  # ── Migraciones contra una BD limpia ──────────────────────────────────
  # Aplica todas las migraciones desde cero. Detecta las que sólo funcionan
  # sobre una base con historia previa, o las que se pisan entre sí. Es la red
  # que faltaba: la 034 y la 035 se validaron a mano en un portátil.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sports_user
          POSTGRES_PASSWORD: sports_pass
          POSTGRES_DB: sports_results_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sports_user -d sports_results_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://sports_user:sports_pass@localhost:5432/sports_results_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      # Sin --env-file: DATABASE_URL viene del entorno del job, igual que en
      # producción, donde se ejecuta con `$DC exec api npx tsx …`.
      - name: Aplicar migraciones desde cero
        run: npx tsx packages/db/src/migrate.ts

      - name: Reaplicar (deben ser idempotentes)
        run: npx tsx packages/db/src/migrate.ts

      # Comprobación mínima de que el esquema quedó como esperamos. El índice
      # único es del que depende el upsert de eventos: si falta, el scraper
      # revienta en producción.
      - name: Verificar esquema
        run: |
          PGPASSWORD=sports_pass psql -h localhost -U sports_user -d sports_results_ci -qtAX \
            -v ON_ERROR_STOP=1 -c "
              SELECT CASE WHEN COUNT(*) = 5 THEN 'ok'
                          ELSE 'FALTAN INDICES: ' || COUNT(*)::text || ' de 5' END
              FROM pg_indexes WHERE indexname IN (
                'uq_match_events_match_source_ref',
                'idx_matches_season_scheduled',
                'idx_matches_live_partial',
                'idx_matches_season_status_scheduled',
                'idx_match_events_player')" | grep -qx ok

  # ── Tests de integración contra Postgres real ─────────────────────────────
  # Job aparte de `migrations` a propósito: aquel comprueba que el ESQUEMA se
  # construye desde cero, este que la LÓGICA que lo usa hace lo que dice. Y son
  # aparte de `quality` porque los unitarios deben seguir corriendo en segundos
  # sin depender de nada — mezclarlos acaba en unitarios que necesitan una base,
  # o en tests de integración que se saltan en silencio.
  #
  # Por qué contra Postgres de verdad y no un emulador en memoria: este código
  # vive de SQL crudo con índices únicos PARCIALES, `ON CONFLICT ... WHERE`,
  # `make_interval` y borrado por `ctid`. Los emuladores no soportan buena parte
  # de eso y darían verde donde producción rompe.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine   # misma mayor que producción
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sticklive_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U test -d sticklive_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://test:test@localhost:5433/sticklive_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      # El propio arranque aplica las migraciones desde los .sql reales
      # (tests/integration/support/global-setup.ts).
      - name: Tests de integración
        run: npm run test:integration

  # ── La imagen de producción construye ────────────────────────────────────
  # Hasta ahora un Dockerfile roto sólo se descubría desplegando.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen de producción
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://sticklive.eu/api \
            --build-arg NEXT_PUBLIC_SITE_URL=https://sticklive.eu \
            --build-arg NEXT_PUBLIC_SEASON_ID= \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY= \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY= \
            --build-arg SENTRY_AUTH_TOKEN= \
            -t sticklive:ci .

      # El scheduler aborta si falta flock. Comprobamos que la imagen lo trae:
      # es justo lo que se añadió al Dockerfile y nadie volvería a mirarlo.
      - name: flock presente en la imagen
        run: docker run --rm --entrypoint sh sticklive:ci -c 'command -v flock'

      # La imagen de producción no debe llevar el toolchain de desarrollo. Si
      # `tsx` reaparece, es que alguien lo movió a `dependencies` o se saltó el
      # `--omit=dev`, y volveríamos a ejecutar TypeScript sin compilar en prod.
      - name: sin tsx ni typescript en la imagen
        run: |
          docker run --rm --entrypoint sh sticklive:ci -c '
            for m in tsx typescript ts-node; do
              if [ -e "node_modules/$m" ]; then echo "✗ $m está en la imagen"; exit 1; fi
            done
            echo "✓ sin toolchain de desarrollo"'

      # Sin código fuente TypeScript NUESTRO: lo que corre es el bundle de dist/.
      #
      # Se excluye `.next` además de `node_modules`: Next genera stubs de tipos
      # en `.next/types/app/**/*.ts` durante el build. Son metadatos suyos, no
      # código que se ejecute, y no los controlamos.
      #
      # Imprime las rutas al fallar. La primera versión sólo daba el número
      # ("✗ 15 ficheros .ts"), que obliga a otra vuelta entera de CI para saber
      # de cuáles habla. Un check que detecta y no señala cuesta más de lo que
      # ahorra.
      - name: sin fuentes .ts en la imagen
        run: |
          docker run --rm --entrypoint sh sticklive:ci -c '
            sobran=$(find /app -name "*.ts" \
                       -not -path "*/node_modules/*" \
                       -not -path "/app/apps/web/.next/*")
            if [ -n "$sobran" ]; then
              echo "✗ fuentes .ts en la imagen de producción:"
              echo "$sobran"
              exit 1
            fi
            echo "✓ sin fuentes .ts propias"'

      # Cada proceso que arranca en producción tiene que existir compilado. Un
      # fallo aquí significa que el compose apunta a un fichero que no está, y
      # el síntoma en el servidor sería un contenedor reiniciándose en bucle.
      - name: los entrypoints de producción existen
        run: |
          docker run --rm --entrypoint sh sticklive:ci -c '
            for f in dist/apps/api/src/index.js \
                     dist/apps/etl/src/cron-live.js \
                     dist/apps/etl/src/run-pipeline.js \
                     dist/apps/scraper/src/index.js \
                     dist/packages/db/src/migrate.js \
                     dist/packages/db/scripts/purge-scrape-logs.js; do
              [ -f "$f" ] || { echo "✗ falta $f"; exit 1; }
            done
            echo "✓ entrypoints presentes"'

      # Los bundles dejan node_modules externo: el runtime resuelve cada import
      # desde dist/ hacia /app/node_modules. Un paquete anidado en el lockfile
      # (apps/api/node_modules/...) u olvidado en devDependencies no se
      # descubre hasta que el proceso importa — y aquí nadie ejecutaba la API.
      # Así fue el crash-loop de nodemailer del 26/09/2026: imagen compilada,
      # entrypoints presentes y producción caída. Este paso reproduce la
      # resolución real de Node para cada paquete externo de cada bundle.
      - name: las dependencias externas de dist/ resuelven en la imagen
        run: |
          docker run --rm --network none \
            -v "$PWD/scripts/verify-image-deps.mjs:/app/verify-image-deps.mjs:ro" \
            --entrypoint node sticklive:ci /app/verify-image-deps.mjs /app/dist

      # El scheduler es un shell script que invoca esos ficheros por ruta. Si
      # alguien renombra un entrypoint y olvida el script, no lo detecta nada
      # hasta que la tarea toca correr — que puede ser semanas después.
      - name: el scheduler apunta a ficheros que existen
        run: |
          docker run --rm --entrypoint sh sticklive:ci -c '
            grep -o "dist/[a-zA-Z0-9/._-]*\.js" deploy/etl-scheduler.sh | sort -u | while read -r f; do
              [ -f "$f" ] || { echo "✗ el scheduler llama a $f, que no existe"; exit 1; }
              echo "  ✓ $f"
            done'

      # No corre como root.
      - name: la imagen corre sin privilegios
        run: |
          u=$(docker run --rm --entrypoint sh sticklive:ci -c 'id -un')
          [ "$u" = "node" ] || { echo "✗ corre como $u"; exit 1; }
          echo "✓ corre como $u"
