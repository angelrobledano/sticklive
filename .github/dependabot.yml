version: 2
updates:
  # Dependencias npm de todo el monorepo (raíz + apps + packages).
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    # Agrupa minor+patch en un solo PR para reducir ruido; los major van sueltos
    # para revisarlos con cuidado (pueden traer breaking changes).
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # Mantener al día las GitHub Actions (esto bumpea actions/checkout y
  # setup-node, lo que silencia el aviso de Node 20 deprecado en la CI).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    commit-message:
      prefix: "ci"
