<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="960" height="340" fill="#ffffff"/>
  <text x="25" y="42" font-size="22" font-weight="700" fill="#0f172a">Roadmap de Stick Live: Now / Next / Later</text>
  <text x="25" y="66" font-size="14" fill="#64748b">Ampliar competiciones poco a poco, verificando que el scraping coge bien los datos antes de sumar.</text>

