# ============================================================
# PostgreSQL para DESARROLLO local.
#
# El resto de servicios (api, web, etl, scraper) se ejecutan a mano con npm
# mientras se desarrolla. La pila completa en contenedores es la de PRODUCCIÓN:
# docker-compose.prod.yml en la raíz, que construye deploy/Dockerfile.
#
# Uso:
#   docker compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/docker-compose.dev.yml up -d postgres
#
# docker-compose.dev.yml es un OVERRIDE (no define `image`): hay que pasarlo
# SIEMPRE junto a este fichero, nunca en solitario.
#
# Historial: aquí había además servicios `scraper` y `api`. El de `api`
# apuntaba a apps/api/Dockerfile, que NO EXISTE desde que el despliegue se
# unificó en deploy/Dockerfile — cualquier `up` sin nombrar servicio fallaba.
# El de `scraper` levantaba crons contra la BD de desarrollo sin pedirlo. Se
# eliminan los dos: este fichero es la base de datos y nada más.
#
# También se quitó `version:`, obsoleto en Compose v2 y responsable de un
# warning en cada invocación.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_postgres
    restart: unless-stopped
    environment:
      # OJO: POSTGRES_DB/USER/PASSWORD sólo se aplican en la PRIMERA
      # inicialización del volumen. Si `postgres_data` ya existe, cambiarlos
      # no renombra nada: la base sigue llamándose como el día que se creó.
      # Para empezar de cero:  docker compose ... down -v
      POSTGRES_DB: sports_results
      POSTGRES_USER: sports_user
      POSTGRES_PASSWORD: sports_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Las migraciones se aplican solas al crear el volumen por primera vez.
      # Después, `npm run db:migrate` (lleva registro de las ya aplicadas).
      - ../../packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_user -d sports_results"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
