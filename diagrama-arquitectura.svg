<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="25" y="42" font-size="22" font-weight="700" fill="#0f172a">El flujo de datos de Stick Live, de punta a punta</text>
  <text x="25" y="66" font-size="14" fill="#64748b">De la web oficial al móvil del aficionado, con el marcador moviéndose en tiempo real</text>

  <!-- boxes -->
  <g>
    <!-- b1 -->
    <rect x="25" y="110" width="120" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="85" y="150" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Web oficial</text>
    <text x="85" y="170" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">FEP</text>
    <text x="85" y="230" font-size="12" fill="#64748b" text-anchor="middle">Fuente</text>
    <!-- b2 -->
    <rect x="183" y="110" width="120" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="243" y="150" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Scraper</text>
    <text x="243" y="170" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">+ ETL</text>
    <text x="243" y="230" font-size="12" fill="#64748b" text-anchor="middle">1 · Ingesta</text>
    <!-- b3 -->
    <rect x="341" y="110" width="120" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="401" y="162" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
    <text x="401" y="230" font-size="12" fill="#64748b" text-anchor="middle">2 · Almacén</text>
    <!-- b4 (accent) -->
    <rect x="499" y="110" width="120" height="92" rx="10" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="559" y="150" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">API</text>
    <text x="559" y="170" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">+ SSE</text>
    <text x="559" y="230" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">3 · Tiempo real</text>
    <!-- b5 -->
    <rect x="657" y="110" width="120" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="717" y="150" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Caddy</text>
    <text x="717" y="170" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">/ VPS</text>
    <text x="717" y="230" font-size="12" fill="#64748b" text-anchor="middle">Hetzner</text>
    <!-- b6 -->
    <rect x="815" y="110" width="120" height="92" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="875" y="150" font-size="15" font-weight="600" fill="#065f46" text-anchor="middle">Aficionado</text>
    <text x="875" y="172" font-size="18" text-anchor="middle">📱</text>
    <text x="875" y="230" font-size="12" fill="#64748b" text-anchor="middle">Móvil</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="147" y1="156" x2="179" y2="156" marker-end="url(#arrow)"/>
    <line x1="305" y1="156" x2="337" y2="156" marker-end="url(#arrow)"/>
    <line x1="463" y1="156" x2="495" y2="156" marker-end="url(#arrow)"/>
    <line x1="621" y1="156" x2="653" y2="156" marker-end="url(#arrow)"/>
    <line x1="779" y1="156" x2="811" y2="156" marker-end="url(#arrow)"/>
  </g>

  <!-- realtime annotation -->
  <text x="559" y="270" font-size="12" fill="#2563eb" text-anchor="middle" font-style="italic">push en cuanto cambia el marcador</text>
</svg>
