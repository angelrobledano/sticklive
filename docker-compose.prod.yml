# ============================================================
# Stick Live — producción (VPS).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Servicios:
#   postgres  → datos (volumen persistente)
#   migrate   → aplica las migraciones y termina; api y etl esperan a que acabe
#   api       → Hono en :3000
#   web       → Next.js en :3001
#   caddy     → TLS y proxy inverso (:80/:443)
#   etl       → planificador de scraping
#
# Todos los procesos de node arrancan desde `dist/`, ya empaquetado en la
# imagen (ver deploy/Dockerfile y scripts/build-server.mjs). En producción ya
# no hay `tsx` ni TypeScript.
#
# Límites de memoria: el VPS tiene 4 GB. La suma de los límites (≈3,4 GB) deja
# margen para el sistema. Sin ellos, una fuga en el ETL —que hace scraping en
# bucle— podía llevarse por delante a Postgres, que es el único servicio cuyos
# datos no se reconstruyen volviendo a scrapear.
# ============================================================

# Rotación de logs de contenedor (#163). El driver por defecto (json-file)
# crece sin límite: cron-live loguea cada ciclo de 45 s durante los directos y
# el VPS tiene 4 GB de disco. Sin esto, una tabla purgada no protege el disco.
# 10 MB × 3 ficheros por servicio acotan el uso en todos los servicios.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ── Entorno explícito por servicio (#300) ──────────────────────────────────
# Antes cada servicio usaba `env_file: .env.prod`, lo que inyectaba TODAS las
# variables del fichero en cada contenedor: `web` recibía POSTGRES_PASSWORD
# (nunca la usa) y api/web/etl el SENTRY_AUTH_TOKEN de build (que solo debe
# existir durante el build). `--env-file .env.prod` sigue siendo la FUENTE de
# los valores (interpolación de ${VAR} en el compose), pero a partir de aquí
# cada servicio declara SOLO lo que consume: lo que no se lista no llega al
# contenedor. Si se añade una variable nueva al código, hay que añadirla aquí.
x-env-log: &env-log
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_FORMAT: "${LOG_FORMAT:-}"
  SERVICE_NAME: "${SERVICE_NAME:-}"

x-env-alerts: &env-alerts
  # Sin SENTRY_DSN toda la alertabilidad del pipeline queda en no-op silencioso.
  SENTRY_DSN: "${SENTRY_DSN:-}"

x-env-db: &env-db
  DATABASE_URL: "postgresql://${POSTGRES_USER:-sports_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sports_results}"
  DATABASE_POOL_MIN: "${DATABASE_POOL_MIN:-2}"
  DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-10}"
  DATABASE_STATEMENT_TIMEOUT_MS: "${DATABASE_STATEMENT_TIMEOUT_MS:-15000}"
  DATABASE_QUERY_TIMEOUT_MS: "${DATABASE_QUERY_TIMEOUT_MS:-15000}"

# PostHog lo requieren @sports/analytics (api y el ETL/scraper lo importan).
x-env-posthog: &env-posthog
  POSTHOG_API_KEY: "${POSTHOG_API_KEY:-}"
  POSTHOG_HOST: "${POSTHOG_HOST:-}"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-sports_results}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo loopback del servidor: accesible vía túnel SSH para trabajos
      # masivos de scraping desde IP residencial (escriben directo en prod).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sports_user} -d ${POSTGRES_DB:-sports_results}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Migraciones ──────────────────────────────────────────────────────────
  # Corre una vez y termina. api y etl no arrancan hasta que sale con código 0.
  #
  # Antes esto era un paso MANUAL cuyo orden vivía sólo en docs/DEPLOY.md: si se
  # te olvidaba, arrancaba código que esperaba un esquema que no estaba, y el
  # fallo aparecía después y lejos de la causa. Ahora no se puede saltar, y si
  # una migración falla el despliegue se para en seco en vez de seguir a medias.
  migrate:
    build: &app-build
      context: .
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SEASON_ID: ${NEXT_PUBLIC_SEASON_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    logging: *default-logging
    # Sin restart: es una tarea, no un servicio. `on-failure` la reintentaría en
    # bucle y dejaría el despliegue colgado sin decir por qué.
    restart: "no"
    command: node dist/packages/db/src/migrate.js
    # Solo necesita la BD y el logger (MIGRATIONS_DIR lo fija la imagen).
    environment:
      <<: *env-db
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *app-build
    logging: *default-logging
    restart: unless-stopped
    labels:
      autoheal: "true"   # lo reinicia el sidecar si queda unhealthy (#164)
    command: node dist/apps/api/src/index.js
    # Superficie mínima (#300): aquí NO entran POSTGRES_PASSWORD (va dentro de
    # DATABASE_URL) ni SENTRY_AUTH_TOKEN (es de build; ver anchor &app-build).
    environment:
      <<: [*env-db, *env-log, *env-alerts, *env-posthog]
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      API_BASE_URL: "${API_BASE_URL:-}"
      WEB_BASE_URL: "${WEB_BASE_URL:-}"
      AUTH_STATE_SECRET: "${AUTH_STATE_SECRET:-}"
      AUTH_DEV_LINKS: "${AUTH_DEV_LINKS:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      PREMIUM_PRICE_EUR_CENTS: "${PREMIUM_PRICE_EUR_CENTS:-499}"
      SKIP_SCHEMA_CHECK: "${SKIP_SCHEMA_CHECK:-}"
      STALE_LIVE_HOURS: "${STALE_LIVE_HOURS:-}"
      LIVE_CACHE_TTL_MS: "${LIVE_CACHE_TTL_MS:-}"
      LIVE_CACHE_MAX_ENTRIES: "${LIVE_CACHE_MAX_ENTRIES:-}"
      SSE_BACKUP_POLL_MS: "${SSE_BACKUP_POLL_MS:-}"
      SSE_RETRY_MS: "${SSE_RETRY_MS:-}"
      SSE_MAX_DURATION_MS: "${SSE_MAX_DURATION_MS:-}"
      SSE_MAX_CONNECTIONS: "${SSE_MAX_CONNECTIONS:-}"
      SSE_MAX_CONNECTIONS_PER_IP: "${SSE_MAX_CONNECTIONS_PER_IP:-}"
      SSE_LINEUPS_TTL_MS: "${SSE_LINEUPS_TTL_MS:-}"
      SSE_MAX_QUEUE: "${SSE_MAX_QUEUE:-}"
      PORT: "${PORT:-3000}"
    volumes:
      # Mismo volumen de escudos que web/etl (solo lectura): la API sirve los
      # escudos en /teams/:id/logo desde aquí (auditoría A3).
      - escudos:/app/apps/web/public/escudos:ro
    healthcheck:
      # Con `node` y no con curl: la imagen slim no lo trae, y añadirlo sólo
      # para esto es superficie de ataque a cambio de nada.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    build: *app-build
    logging: *default-logging
    restart: unless-stopped
    labels:
      autoheal: "true"   # lo reinicia el sidecar si queda unhealthy (#164)
    command: node_modules/.bin/next start apps/web -p 3001
    # `web` NO usa env_file: su runtime solo necesita las NEXT_PUBLIC_* (que ya
    # se hornean en build) y el DSN de Sentry, que va fijado en el código. Antes
    # recibía POSTGRES_PASSWORD y SENTRY_AUTH_TOKEN sin usarlos (#300).
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"
      NEXT_PUBLIC_SEASON_ID: "${NEXT_PUBLIC_SEASON_ID:-}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL}"
      NEXT_PUBLIC_POSTHOG_KEY: "${NEXT_PUBLIC_POSTHOG_KEY:-}"
      NEXT_PUBLIC_POSTHOG_HOST: "${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}"
    volumes:
      # Escudos como DATOS (no horneados en la imagen): los rellena el etl con
      # `run-pipeline --entity=download-logos` y los sirve Next desde public/.
      - escudos:/app/apps/web/public/escudos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 128m

  etl:
    build: *app-build
    logging: *default-logging
    restart: unless-stopped
    command: sh deploy/etl-scheduler.sh
    # Superficie mínima (#300). OJO: @sports/analytics lanza en import si faltan
    # POSTHOG_API_KEY/POSTHOG_HOST, así que el ETL los necesita de verdad.
    environment:
      <<: [*env-db, *env-log, *env-alerts, *env-posthog]
      COMPETITION_SOURCES_DRIVEN: "${COMPETITION_SOURCES_DRIVEN:-}"
      SEASON_ID: "${SEASON_ID:-}"
      IDC: "${IDC:-}"
      SEASON_IDS: "${SEASON_IDS:-}"
      DEFAULT_SEASON_ID: "${DEFAULT_SEASON_ID:-}"
      PLAYOFF_SEASON_ID: "${PLAYOFF_SEASON_ID:-}"
      FEP_SOURCE_ID: "${FEP_SOURCE_ID:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      WEB_BASE_URL: "${WEB_BASE_URL:-}"
      STALE_LIVE_HOURS: "${STALE_LIVE_HOURS:-}"
      PARTITION_SEASONS_AHEAD: "${PARTITION_SEASONS_AHEAD:-}"
      POLL_INTERVAL_S: "${POLL_INTERVAL_S:-}"
      WINDOW_HOURS: "${WINDOW_HOURS:-}"
      WINDOW_LOOKBACK_MINUTES: "${WINDOW_LOOKBACK_MINUTES:-}"
      MAX_RUNTIME_MIN: "${MAX_RUNTIME_MIN:-}"
      SOURCE_FAIL_ALERT_THRESHOLD: "${SOURCE_FAIL_ALERT_THRESHOLD:-}"
      MISSING_LIVE_CYCLES: "${MISSING_LIVE_CYCLES:-}"
      FICHA_CONCURRENCY: "${FICHA_CONCURRENCY:-}"
      SCRAPE_CONCURRENCY: "${SCRAPE_CONCURRENCY:-}"
      ETL_BATCH_SIZE: "${ETL_BATCH_SIZE:-}"
      ETL_DRY_RUN: "${ETL_DRY_RUN:-}"
      SCRAPE_STALE_HOURS: "${SCRAPE_STALE_HOURS:-}"
      SCRAPE_EXPECTED_KEYS: "${SCRAPE_EXPECTED_KEYS:-}"
      WSE_SCRAPE_GRACE_DAYS: "${WSE_SCRAPE_GRACE_DAYS:-}"
      WSE_DORMANT_REALERT_HOURS: "${WSE_DORMANT_REALERT_HOURS:-}"
      SCRAPE_LOGS_RETENTION_DAYS: "${SCRAPE_LOGS_RETENTION_DAYS:-}"
      SCRAPE_LOGS_PURGE_BATCH: "${SCRAPE_LOGS_PURGE_BATCH:-}"
      SIDGAD_BASE_URL: "${SIDGAD_BASE_URL:-}"
      SIDGAD_PORTAL: "${SIDGAD_PORTAL:-}"
      SIDGAD_REFERER: "${SIDGAD_REFERER:-}"
      SCRAPER_REQUEST_TIMEOUT_MS: "${SCRAPER_REQUEST_TIMEOUT_MS:-}"
      SCRAPER_RETRY_DELAY_MS: "${SCRAPER_RETRY_DELAY_MS:-}"
      SCRAPER_USER_AGENT: "${SCRAPER_USER_AGENT:-}"
      STAGING_URL: "${STAGING_URL:-}"
      PROD_URL: "${PROD_URL:-}"
    volumes:
      # Mismo volumen que web: el etl escribe los escudos, web los sirve.
      # La ruta la fija ESCUDOS_DIR en la imagen (deploy/Dockerfile).
      - escudos:/app/apps/web/public/escudos
    healthcheck:
      # El ETL no expone HTTP, así que el latido es un fichero que el
      # planificador toca en cada vuelta del bucle. Si lleva más de 45 minutos
      # sin tocarse, el proceso está colgado —no muerto, que eso ya lo ve
      # Docker— y conviene reiniciarlo. El margen (antes 20 min) cubre los ciclos
      # largos con las 9 ligas activas: un ciclo normal no debe marcar unhealthy
      # (#146). Sigue detectando un cuelgue real (>2x el ciclo más largo).
      # Los `$$` son escapes de Compose, que interpola `$` antes de pasar la
      # cadena al contenedor. Con un solo `$` la expresión aritmética se
      # evaluaría (mal) en el host y el healthcheck no comprobaría nada.
      test: ["CMD-SHELL", "test -f /tmp/etl-alive && [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/etl-alive) )) -lt 2700 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Autoheal (api/web) ───────────────────────────────────────────────────
  # Reinicia contenedores que quedan `unhealthy` (proceso vivo pero sin
  # responder). `restart: unless-stopped` solo actúa si el proceso MUERE, no si
  # se cuelga (#164).
  #
  # NUNCA al ETL: su healthcheck es un latido que puede quedar "unhealthy"
  # mientras trabaja (ver #146); reiniciarlo mataría el directo a media faena.
  # Por eso el sidecar solo toca contenedores con el label `autoheal`, que hoy
  # llevan api y web.
  #
  # El ETL colgado-vivo (#373) lo cubre una salvaguarda CONSERVADORA del host
  # (deploy/etl-healthcheck.sh, cron cada 5 min) que solo reinicia el etl si el
  # cuelgue persiste varias pasadas, con alerta y enfriamiento. Aquí no se
  # cambia la política de autoheal.
  #
  # SEGURIDAD: monta el socket de Docker (equivale a root en el host) porque no
  # hay otra forma de leer/actuar sobre otros contenedores. Si se prefiere no
  # aceptar ese riesgo, borrar este servicio y los labels `autoheal` de api/web.
  autoheal:
    image: willfarrell/autoheal:latest
    logging: *default-logging
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30          # segundos entre comprobaciones
      AUTOHEAL_START_PERIOD: 120     # margen tras arrancar antes de vigilar
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  escudos:
