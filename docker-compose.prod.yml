# ============================================================
# Stick Live — producción (VPS).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Servicios:
#   postgres  → datos (volumen persistente)
#   migrate   → aplica las migraciones y termina; api y etl esperan a que acabe
#   api       → Hono en :3000
#   web       → Next.js en :3001
#   caddy     → TLS y proxy inverso (:80/:443)
#   etl       → planificador de scraping
#
# Todos los procesos de node arrancan desde `dist/`, ya empaquetado en la
# imagen (ver deploy/Dockerfile y scripts/build-server.mjs). En producción ya
# no hay `tsx` ni TypeScript.
#
# Límites de memoria: el VPS tiene 4 GB. La suma de los límites (≈3,4 GB) deja
# margen para el sistema. Sin ellos, una fuga en el ETL —que hace scraping en
# bucle— podía llevarse por delante a Postgres, que es el único servicio cuyos
# datos no se reconstruyen volviendo a scrapear.
# ============================================================

# Rotación de logs de contenedor (#163). El driver por defecto (json-file)
# crece sin límite: cron-live loguea cada ciclo de 45 s durante los directos y
# el VPS tiene 4 GB de disco. Sin esto, una tabla purgada no protege el disco.
# 10 MB × 3 ficheros por servicio acotan el uso en todos los servicios.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-sports_results}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Solo loopback del servidor: accesible vía túnel SSH para trabajos
      # masivos de scraping desde IP residencial (escriben directo en prod).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sports_user} -d ${POSTGRES_DB:-sports_results}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Migraciones ──────────────────────────────────────────────────────────
  # Corre una vez y termina. api y etl no arrancan hasta que sale con código 0.
  #
  # Antes esto era un paso MANUAL cuyo orden vivía sólo en docs/DEPLOY.md: si se
  # te olvidaba, arrancaba código que esperaba un esquema que no estaba, y el
  # fallo aparecía después y lejos de la causa. Ahora no se puede saltar, y si
  # una migración falla el despliegue se para en seco en vez de seguir a medias.
  migrate:
    build: &app-build
      context: .
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SEASON_ID: ${NEXT_PUBLIC_SEASON_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        # Google AdSense (#382): vacío = apagado. Se hornean en build.
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_HOME_TOP: ${NEXT_PUBLIC_ADSENSE_SLOT_HOME_TOP:-}
        NEXT_PUBLIC_ADSENSE_SLOT_HOME_INLINE: ${NEXT_PUBLIC_ADSENSE_SLOT_HOME_INLINE:-}
        NEXT_PUBLIC_ADSENSE_SLOT_LIST_INLINE: ${NEXT_PUBLIC_ADSENSE_SLOT_LIST_INLINE:-}
        NEXT_PUBLIC_ADSENSE_SLOT_MATCH_SUMMARY: ${NEXT_PUBLIC_ADSENSE_SLOT_MATCH_SUMMARY:-}
        NEXT_PUBLIC_ADSENSE_SLOT_MATCH_STATS: ${NEXT_PUBLIC_ADSENSE_SLOT_MATCH_STATS:-}
        NEXT_PUBLIC_ADSENSE_SLOT_INTERSTITIAL: ${NEXT_PUBLIC_ADSENSE_SLOT_INTERSTITIAL:-}
        NEXT_PUBLIC_ADS_INTERSTITIAL: ${NEXT_PUBLIC_ADS_INTERSTITIAL:-0}
        NEXT_PUBLIC_ADS_LIST_EVERY: ${NEXT_PUBLIC_ADS_LIST_EVERY:-0}
        # Paywall premium (build): 0 = oculto (la app es gratis); 'stripe' = proveedor.
        NEXT_PUBLIC_PREMIUM_ENABLED: ${NEXT_PUBLIC_PREMIUM_ENABLED:-0}
        NEXT_PUBLIC_PAYMENT_PROVIDER: ${NEXT_PUBLIC_PAYMENT_PROVIDER:-stripe}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    logging: *default-logging
    # Sin restart: es una tarea, no un servicio. `on-failure` la reintentaría en
    # bucle y dejaría el despliegue colgado sin decir por qué.
    restart: "no"
    command: node dist/packages/db/src/migrate.js
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sports_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sports_results}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *app-build
    logging: *default-logging
    restart: unless-stopped
    labels:
      autoheal: "true"   # lo reinicia el sidecar si queda unhealthy (#164)
    command: node dist/apps/api/src/index.js
    env_file: .env.prod
    environment:
      # Rol de mínimo privilegio (#298): DML sin DDL. La password vive en
      # .env.prod (APP_DB_PASSWORD) y migrate sigue con el dueño del esquema.
      DATABASE_URL: postgresql://sticklive_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-sports_results}
    volumes:
      # Mismo volumen de escudos que web/etl (solo lectura): la API sirve los
      # escudos en /teams/:id/logo desde aquí (auditoría A3).
      - escudos:/app/apps/web/public/escudos:ro
    healthcheck:
      # Con `node` y no con curl: la imagen slim no lo trae, y añadirlo sólo
      # para esto es superficie de ataque a cambio de nada.
      #
      # LIVENESS, no readiness: apunta a `/health/live`, que NO consulta la BD.
      # Antes apuntaba a `/health` (con `SELECT 1`), así que un bache de Postgres
      # marcaba la API como `unhealthy` y este sidecar `autoheal` la reiniciaba,
      # añadiendo un pool en frío y 502s (incidente 2026-10-05). `/health` sigue
      # existiendo para el monitor externo (readiness). Ver apps/api/src/routes/health.ts.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    build: *app-build
    logging: *default-logging
    restart: unless-stopped
    labels:
      autoheal: "true"   # lo reinicia el sidecar si queda unhealthy (#164)
    command: node_modules/.bin/next start apps/web -p 3001
    # SIN env_file (#300): la web es el servicio expuesto al navegador y no
    # necesita NINGÚN secreto — los NEXT_PUBLIC_* van horneados en la imagen
    # (deploy/Dockerfile) y la URL de la API es pública. Con el env_file global
    # recibía POSTGRES_PASSWORD y SENTRY_AUTH_TOKEN sin necesidad: superficie de
    # fuga gratis si algún día hay un RCE/SSRF en el SSR.
    environment:
      NODE_ENV: production
      # Token servidor-a-servidor para que la API no aplique las cuotas de
      # visitante al SSR/build de la web (ver read-guard.ts). No es público.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    volumes:
      # Escudos como DATOS (no horneados en la imagen): los rellena el etl con
      # `run-pipeline --entity=download-logos` y los sirve Next desde public/.
      - escudos:/app/apps/web/public/escudos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Directorio, no archivo suelto: `git pull` reemplaza el inodo del
      # Caddyfile y un bind de archivo dejaría al contenedor con la versión
      # antigua. Con el directorio, `caddy reload` lee siempre la nueva.
      - ./deploy:/etc/caddy:ro
      # Log de acceso para fail2ban. `logs/` está en .gitignore; el instalador
      # crea el directorio con permisos 0750.
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 128m

  etl:
    build: *app-build
    logging: *default-logging
    restart: unless-stopped
    command: sh deploy/etl-scheduler.sh
    env_file: .env.prod
    environment:
      # Rol de mínimo privilegio (#298): DML + CREATE de particiones. La
      # password vive en .env.prod (APP_DB_PASSWORD); migrate sigue con el dueño.
      DATABASE_URL: postgresql://sticklive_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-sports_results}
    volumes:
      # Mismo volumen que web: el etl escribe los escudos, web los sirve.
      # La ruta la fija ESCUDOS_DIR en la imagen (deploy/Dockerfile).
      - escudos:/app/apps/web/public/escudos
    healthcheck:
      # El ETL no expone HTTP, así que el latido es un fichero que el
      # planificador toca en cada vuelta del bucle. Si lleva más de 45 minutos
      # sin tocarse, el proceso está colgado —no muerto, que eso ya lo ve
      # Docker— y conviene reiniciarlo. El margen (antes 20 min) cubre los ciclos
      # largos con las 9 ligas activas: un ciclo normal no debe marcar unhealthy
      # (#146). Sigue detectando un cuelgue real (>2x el ciclo más largo).
      # Los `$$` son escapes de Compose, que interpola `$` antes de pasar la
      # cadena al contenedor. Con un solo `$` la expresión aritmética se
      # evaluaría (mal) en el host y el healthcheck no comprobaría nada.
      test: ["CMD-SHELL", "test -f /tmp/etl-alive && [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/etl-alive) )) -lt 2700 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Autoheal (api/web) ───────────────────────────────────────────────────
  # Reinicia contenedores que quedan `unhealthy` (proceso vivo pero sin
  # responder). `restart: unless-stopped` solo actúa si el proceso MUERE, no si
  # se cuelga (#164).
  #
  # NUNCA al ETL: su healthcheck es un latido que puede quedar "unhealthy"
  # mientras trabaja (ver #146); reiniciarlo mataría el directo a media faena.
  # Por eso el sidecar solo toca contenedores con el label `autoheal`, que hoy
  # llevan api y web.
  #
  # El ETL colgado-vivo (#373) lo cubre una salvaguarda CONSERVADORA del host
  # (deploy/etl-healthcheck.sh, cron cada 5 min) que solo reinicia el etl si el
  # cuelgue persiste varias pasadas, con alerta y enfriamiento. Aquí no se
  # cambia la política de autoheal.
  #
  # SEGURIDAD: monta el socket de Docker (equivale a root en el host) porque no
  # hay otra forma de leer/actuar sobre otros contenedores. Si se prefiere no
  # aceptar ese riesgo, borrar este servicio y los labels `autoheal` de api/web.
  autoheal:
    image: willfarrell/autoheal:latest
    logging: *default-logging
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30          # segundos entre comprobaciones
      AUTOHEAL_START_PERIOD: 120     # margen tras arrancar antes de vigilar
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  escudos:
